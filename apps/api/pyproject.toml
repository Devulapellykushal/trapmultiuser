[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-inventory-api"
version = "1.0.0"
description = "Quake Inventory Management System - Backend API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    "Django>=4.2,<5.0",
    "djangorestframework>=3.14",
    "psycopg2-binary>=2.9",
    "drf-spectacular>=0.27",
    "python-dotenv>=1.0",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "requests>=2.31",
    "python-barcode>=0.15",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "reportlab>=4.0",
    "weasyprint>=61.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
]

# Explicit discovery: flat layout picks up non-package dirs (e.g. barcodes/ SVG assets).
[tool.setuptools.packages.find]
where = ["."]
include = [
    "analytics*",
    "core*",
    "inventory*",
    "invoices*",
    "notifications*",
    "reports*",
    "sales*",
    "users*",
]
exclude = ["barcodes*", "venv*", ".venv*", "tests*", "test*", "*tests*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
